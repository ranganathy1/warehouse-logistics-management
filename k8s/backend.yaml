apiVersion: apps/v1
kind: Deployment
metadata:
  name: wlms-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wlms-backend
  template:
    metadata:
      labels:
        app: wlms-backend
    spec:
      containers:
        - name: backend
          image: wlms-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: wlms-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: wlms-backend-secrets
                  key: DB_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wlms-backend-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wlms-backend
spec:
  type: ClusterIP
  selector:
    app: wlms-backend
  ports:
    - name: http
      port: 8000
      targetPort: http