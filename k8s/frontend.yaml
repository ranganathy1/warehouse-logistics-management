apiVersion: apps/v1
kind: Deployment
metadata:
  name: wlms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wlms-frontend
  template:
    metadata:
      labels:
        app: wlms-frontend
    spec:
      containers:
        - name: frontend
          image: wlms-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wlms-frontend
spec:
  type: ClusterIP
  selector:
    app: wlms-frontend
  ports:
    - name: http
      port: 80
      targetPort: http